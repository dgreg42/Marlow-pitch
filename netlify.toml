# Marlow investor overview.
# Kept out of search results on purpose: the photography on this page is reference
# and is not licensed for public use. Remove the X-Robots-Tag only after the real
# photography is in and the page is meant to be found.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
