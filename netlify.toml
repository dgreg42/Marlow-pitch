# Marlow investor overview.
# Kept out of search results on purpose: the photography on this page is reference
# and is not licensed for public use. Remove the X-Robots-Tag only after the real
# photography is in and the page is meant to be found.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# These filenames are hand managed and get replaced in place, so they are not
# content addressed and "immutable" is wrong for them. It is worse than wrong: Netlify applies
# this header to a 404 as well, so any asset URL requested while the file was missing stayed
# broken in that browser for a year and never revalidated. A day is long enough to be fast and
# short enough to self heal. The build also appends ?v=N to every asset URL (build-live.py).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
